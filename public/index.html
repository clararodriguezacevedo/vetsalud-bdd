<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VetSalud - panel de consultas</title>
  <style>
    :root { --fg: #1f2421; --muted: #6b726c; --line: #e3e6e2; --accent: #1d9e75; --bg: #fafbfa; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--fg); }
    header { padding: 24px 32px; border-bottom: 1px solid var(--line); background: #fff; }
    header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    main { display: grid; grid-template-columns: 280px 1fr; gap: 0; min-height: calc(100vh - 73px); }
    nav { padding: 20px; border-right: 1px solid var(--line); background: #fff; }
    nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 12px; }
    button { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 8px;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; color: var(--fg); }
    button:hover { border-color: var(--accent); }
    .row { display: flex; gap: 6px; margin-bottom: 8px; }
    .row input { flex: 1; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; width: 100%; }
    .row button { margin: 0; width: auto; white-space: nowrap; }
    section { padding: 24px 32px; overflow: auto; }
    .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    pre { background: #0f1512; color: #c8e6d8; padding: 16px; border-radius: 10px; font-size: 13px;
      line-height: 1.5; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 0; }
    .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
    .mongo { background: #e1f5ee; color: #0f6e56; }
    .redis { background: #fbeaf0; color: #993556; }
  </style>
</head>
<body>
  <header>
    <h1>VetSalud - panel de consultas</h1>
    <p>Persistencia políglota — MongoDB (dominio) + Redis (stock)</p>
  </header>
  <main>
    <nav>
      <h2>Consultas de lectura</h2>

      <!-- 1 - Pacientes activos con propietario -->
      <button onclick="get('/api/pacientes-activos', '1 - Pacientes activos + propietario')">
        1 - Pacientes activos<span class="pill mongo">Mongo</span>
      </button>

      <!-- 7 - Top 5 diagnósticos -->
      <button onclick="get('/api/top-diagnosticos', '7 - Top 5 diagnósticos')">
        7 - Top diagnósticos<span class="pill mongo">Mongo</span>
      </button>

      <!-- 8 - Stock bajo -->
      <button onclick="get('/api/stock-bajo?umbral=50', '8 - Stock bajo (&lt; 50 unidades)')">
        8 - Stock bajo<span class="pill redis">Redis</span>
      </button>

      <!-- 9 - Controles baratos -->
      <button onclick="get('/api/controles-baratos?max=5000', '9 - Controles &lt; $5000')">
        9 - Controles baratos<span class="pill mongo">Mongo</span>
      </button>

      <!-- 10 - Pacientes por sucursal -->
      <button onclick="get('/api/pacientes-sucursal?sucursal=Palermo', '10 - Pacientes de Palermo')">
        10 - Pacientes por sucursal<span class="pill mongo">Mongo</span>
      </button>

      <!-- 11 - Ingresos por veterinario (mes actual) -->
      <button onclick="get('/api/ingresos-vet-mes', '11 - Ingresos por vet (mes actual)')">
        11 - Ingresos por vet<span class="pill mongo">Mongo</span>
      </button>

      <!-- 12 - Propietarios sin consultas en el último año -->
      <button onclick="get('/api/propietarios-inactivos', '12 - Propietarios sin consultas (1 año)')">
        12 - Propietarios inactivos<span class="pill mongo">Mongo</span>
      </button>

      <!-- 13 - ABM de propietarios -->
      <h2 style="margin-top:24px">13 - ABM propietarios<span class="pill mongo">Mongo</span></h2>
      <div class="row">
        <input id="propId" placeholder="id (ej: C007)" value="C007" />
      </div>
      <div class="row">
        <input id="propNombre" placeholder="nombre" value="Lucía" />
        <input id="propApellido" placeholder="apellido" value="Vega" />
      </div>
      <div class="row">
        <input id="propCiudad" placeholder="ciudad" value="CABA" />
      </div>
      <button onclick="altaProp()">Alta propietario</button>
      <button onclick="modProp()">Modificar (ciudad)</button>
      <button onclick="bajaProp()">Baja lógica</button>

      <!-- 14 - Alta de consulta -->
      <h2 style="margin-top:24px">14 - Alta consulta<span class="pill mongo">Mongo</span></h2>
      <div class="row">
        <input id="consPac" placeholder="id_paciente" value="P002" />
        <input id="consVet" placeholder="id_vet" value="V003" style="max-width:90px" />
      </div>
      <div class="row">
        <input id="consMotivo" placeholder="motivo" value="Control" />
      </div>
      <div class="row">
        <input id="consCosto" placeholder="costo" value="3000" />
      </div>
      <button onclick="altaCons()">Alta consulta</button>

      <!-- 15 - Decrementar stock -->
      <h2 style="margin-top:24px">15 - Decrementar stock<span class="pill redis">Redis</span></h2>
      <div class="row">
        <input id="prod" placeholder="id (ej: PRD001)" value="PRD001" />
        <input id="cant" placeholder="cant." value="3" style="max-width:70px" />
      </div>
      <button onclick="decrementar()">Aplicar decremento</button>
    </nav>
    <section>
      <div class="label" id="titulo">Elegí una consulta del panel izquierdo.</div>
      <pre id="salida">{ }</pre>
    </section>
  </main>

  <script>
    const salida = document.getElementById('salida');
    const titulo = document.getElementById('titulo');
    const v = (id) => document.getElementById(id).value.trim();

    function render(title, data) {
      titulo.innerHTML = title;
      salida.textContent = JSON.stringify(data, null, 2);
    }

    async function get(url, title) {
      titulo.textContent = 'Cargando…';
      try {
        const res = await fetch(url);
        render(title, await res.json());
      } catch (e) {
        render(title, { error: e.message });
      }
    }

    async function send(method, url, body, title) {
      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : undefined,
        });
        render(title, await res.json());
      } catch (e) {
        render(title, { error: e.message });
      }
    }

    // 13 - ABM propietarios
    function altaProp() {
      send('POST', '/api/propietarios', {
        _id: v('propId'),
        nombre: v('propNombre'),
        apellido: v('propApellido'),
        ciudad: v('propCiudad'),
      }, `13 - Alta propietario ${v('propId')}`);
    }
    function modProp() {
      send('PUT', `/api/propietarios/${v('propId')}`, { ciudad: v('propCiudad') },
        `13 - Modificar propietario ${v('propId')}`);
    }
    function bajaProp() {
      send('DELETE', `/api/propietarios/${v('propId')}`, null,
        `13 - Baja lógica propietario ${v('propId')}`);
    }

    // 14 - Alta consulta
    function altaCons() {
      send('POST', '/api/consultas', {
        id_paciente: v('consPac'),
        id_vet: v('consVet'),
        motivo: v('consMotivo'),
        costo: Number(v('consCosto')),
      }, '14 - Alta de consulta');
    }

    // 15 - Decrementar stock
    function decrementar() {
      const id_producto = v('prod');
      const cantidad = Number(v('cant'));
      send('POST', '/api/decrementar-stock', { id_producto, cantidad },
        `15 - Decremento de ${id_producto} (-${cantidad})`);
    }
  </script>
</body>
</html>
